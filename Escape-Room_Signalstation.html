<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Room: Signalstation</title>
<style>
:root{
  --bg:#15122a; --panel:#241f3d; --panel2:#2f2850; --ink:#f4ecd8; --muted:#b9b0d0;
  --accent:#ffcf3f; --accent-d:#c99a12; --red:#e5533d; --green:#5fd068; --blue:#4fa3e0;
  --line:#0b0918; --paper:#fbf6e9; --paper-ink:#1f1a12;
  --mono: Consolas, "Lucida Console", "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;background:
  radial-gradient(ellipse at top,#231d45 0%,transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 3px,#0000000f 3px 4px),var(--bg)}
button{font:inherit;color:inherit}
.pix{font-family:var(--mono);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.03em;
  background:var(--accent);color:#1b1500;border:3px solid var(--line);padding:9px 16px;cursor:pointer;
  box-shadow:inset -3px -3px 0 var(--accent-d),inset 3px 3px 0 #fff3b0;border-radius:0;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.alt{background:#8e86b3;color:#120f22;box-shadow:inset -3px -3px 0 #5f5786,inset 3px 3px 0 #c8c2e4}
.btn.ghost{background:transparent;color:var(--ink);border-color:#5b5287;box-shadow:none}
.btn.ok{background:var(--green);box-shadow:inset -3px -3px 0 #3a9a45,inset 3px 3px 0 #b6f0bd}
.btn.small{font-size:14px;padding:6px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Layout ---------- */
#app{max-width:1100px;margin:0 auto;padding:14px 16px 30px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--accent);text-shadow:3px 3px 0 #000;letter-spacing:.06em}
.brand small{display:block;font-size:13px;color:var(--muted);text-shadow:none;letter-spacing:.02em;text-transform:none;font-weight:400}
.locks{display:flex;gap:8px;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--line);padding:4px 9px;font-family:var(--mono);font-size:13px;font-weight:700}
.lock i{width:12px;height:12px;background:var(--red);box-shadow:0 0 6px var(--red);display:inline-block}
.lock.open i{background:var(--green);box-shadow:0 0 8px var(--green)}
.tools{display:flex;gap:8px}

.roomwrap{position:relative;border:6px solid var(--line);box-shadow:0 0 0 4px #4a4170,10px 10px 0 4px #00000080;background:#000}
#room{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.hot{position:absolute;background:transparent;border:3px dashed transparent;cursor:pointer;padding:0}
.hot:hover,.hot:focus-visible{border-color:var(--accent);background:#ffcf3f14;outline:none}
.hot .lbl{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;
  background:var(--line);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:14px;padding:3px 8px;
  opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}

.hot .badge{position:absolute;right:-8px;top:-8px;width:24px;height:24px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:700;font-size:15px;border:3px solid var(--line);background:var(--accent);color:#1b1500}
.hot .badge.done{background:var(--green);animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hint-line{margin-top:12px;color:var(--muted);font-size:16px;text-align:center}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:#07051299;display:flex;align-items:flex-start;justify-content:center;padding:3vh 12px;z-index:50;overflow:auto}
.overlay.top{z-index:80}
.modal{background:var(--panel);border:5px solid var(--line);box-shadow:0 0 0 4px #5b5287,12px 12px 0 4px #000a;width:100%;max-width:940px;position:relative}
.modal.narrow{max-width:560px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);padding:10px 16px;border-bottom:4px solid var(--line)}
.mhead h2{margin:0;font-family:var(--mono);font-size:20px;color:var(--accent);letter-spacing:.05em}
.mhead .sub{font-size:14px;color:var(--muted)}
.mbody{padding:16px 18px 18px}
.close{background:var(--red);border:3px solid var(--line);color:#fff;font-family:var(--mono);font-weight:700;width:38px;height:38px;cursor:pointer;flex:none}
.steps{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.steps span{font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 8px;border:2px solid #5b5287;color:var(--muted)}
.steps span.cur{border-color:var(--accent);color:var(--accent)}
.steps span.done{border-color:var(--green);color:var(--green)}
.task-title{font-family:var(--mono);font-size:19px;margin:0 0 4px;color:#fff}
.kind{display:inline-block;font-size:12px;font-family:var(--mono);font-weight:700;padding:2px 7px;background:#4a4170;color:#e9e3ff;margin-bottom:8px}
.story{color:#ddd5ee;margin:6px 0 14px}
.paper{background:var(--paper);color:var(--paper-ink);border:4px solid var(--line);padding:14px;box-shadow:inset 0 0 0 3px #e7dcc0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.answer input,.inp{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:#0f0c20;color:var(--accent);border:3px solid #5b5287;padding:8px 12px;min-width:220px;flex:1}
.answer input:focus,.inp:focus{outline:none;border-color:var(--accent)}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:3px dashed #4a4170;margin-top:16px;padding-top:12px}
.mfoot .spacer{flex:1}
.fb{margin-top:12px;padding:10px 12px;border:3px solid var(--line);font-weight:600;display:none}
.fb.bad{display:block;background:#4a1d1d;color:#ffd6cf;border-color:#a8382a}
.fb.good{display:block;background:#173a1f;color:#cff7d4;border-color:#3a9a45}
.fb.info{display:block;background:#2d2650;color:#e6e0ff;border-color:#6c62a3}
.solbox{margin-top:12px;padding:12px;background:#3a2f12;border:3px solid var(--accent-d);color:#ffefb8}

/* ---------- Morse ---------- */
.mc{display:inline-flex;gap:5px;align-items:center}
.mc i{display:inline-block;background:currentColor}
.mc i.d{width:9px;height:9px;border-radius:50%}
.mc i.l{width:26px;height:8px}
.morse-line{display:flex;flex-wrap:wrap;gap:12px 30px;font-size:0;padding:16px;background:#0f0c20;border:3px solid #5b5287;color:var(--accent);margin:10px 0}
.morse-line .mc{min-height:16px}
.radio{display:flex;align-items:center;gap:14px;background:#3d4e2b;border:4px solid var(--line);padding:12px;box-shadow:inset 0 0 0 3px #4f6339}
.lamp{width:34px;height:34px;border-radius:50%;background:#4a1010;border:4px solid #1b1b1b;transition:background .03s}
.lamp.on{background:#ff4a3a;box-shadow:0 0 22px #ff4a3a}
.radio .grill{flex:1;height:34px;background:repeating-linear-gradient(0deg,#2a3520 0 3px,#3d4e2b 3px 6px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:52px;padding:8px;background:#0f0c20;border:3px solid #5b5287}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border:2px solid #5b5287;color:var(--accent);font-size:0;min-width:44px}
.chip b{font-size:13px;font-family:var(--mono);color:var(--muted)}
.chip.cur{border-style:dashed;border-color:var(--accent)}
.chip.ok{border-color:var(--green);color:var(--green)}
.chip.no{border-color:var(--red);color:var(--red)}
.keypad{display:flex;flex-wrap:wrap;gap:8px}
.keypad .big{font-size:24px;min-width:90px}
.target{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.3em;color:#fff}
.target span.cur{color:var(--accent);text-decoration:underline}
.target span.ok{color:var(--green)}

/* Morse tree */
.tree{position:relative;height:340px;background:var(--paper);border:4px solid var(--line);margin:8px 0}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#ffc935;border:3px solid #6d5410;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px;color:#1f1a12}
.node.root{background:#e9d48a}
.slot{background:#fff6d6;border-style:dashed;cursor:pointer}
.slot.over{background:#fff;box-shadow:0 0 0 4px var(--blue)}
.slot.ok{background:#bff0c4;border-color:#2c8a38;border-style:solid}
.slot.no{background:#ffc9c0;border-color:#b3261e;border-style:solid}
.tile{font-family:var(--mono);font-weight:700;font-size:20px;width:42px;height:42px;background:var(--accent);color:#1b1500;border:3px solid var(--line);
  box-shadow:inset -3px -3px 0 var(--accent-d);cursor:grab;display:inline-grid;place-items:center;padding:0;user-select:none}
.tile.sel{background:#fff;box-shadow:0 0 0 3px var(--blue)}
.slot .tile{width:36px;height:36px;font-size:18px;box-shadow:none;border-width:2px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#0f0c20;border:3px solid #5b5287;min-height:66px}
.bank.over{border-color:var(--blue)}
.mcq{display:grid;gap:8px;margin-top:10px}
.mcq button{text-align:left;font-size:17px;background:#332b59;border:3px solid #5b5287;color:var(--ink);padding:10px 12px;cursor:pointer}
.mcq button:hover{border-color:var(--accent)}
.mcq button.no{border-color:var(--red);background:#4a1d1d}
.mcq button.ok{border-color:var(--green);background:#173a1f}

/* ---------- Winker ---------- */
.sem{display:block}
.strip{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.fig{background:#fff;border:3px solid var(--line);padding:4px;display:flex;flex-direction:column;align-items:center}
.fig .sem{width:88px;height:90px}
.fig .ln{width:60px;height:3px;background:#cfc6b0;margin:2px 0 4px}
.matchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:8px 0 12px}
.mitem{background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px;gap:6px}
.mitem .sem{width:96px;height:98px}
.mitem img{width:100px;height:100px;object-fit:contain}
.mitem .slot{width:48px;height:48px;border:3px dashed #8a7a3a;display:grid;place-items:center;border-radius:0}
.semwrap{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.semwrap .sem{width:300px;height:300px;background:#fff;border:4px solid var(--line)}
.sem .tg{fill:#ffffff;stroke:#7a6fb0;stroke-width:2;stroke-dasharray:3 2;cursor:pointer}
.sem .tg:hover{fill:#fff3c4;stroke:#c99a12}
.sem .tg.on{fill:#ffe48a;stroke:#c99a12;stroke-dasharray:none}
.sem g{pointer-events:none}

/* ---------- Braille ---------- */
.bc{display:inline-grid;grid-template-columns:repeat(2,var(--d,16px));grid-auto-rows:var(--d,16px);gap:calc(var(--d,16px)*.45);
  padding:calc(var(--d,16px)*.55);background:#fff;border:3px solid var(--line)}
.bc i{border-radius:50%;background:transparent;border:2px dotted #c9c0a8}
.bc i.on{background:#1f1a12;border:2px solid #1f1a12;box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #6b5f48}
.bc.edit i{cursor:pointer;border:2px dashed #9a8f75}
.bc.edit i:hover{background:#e8dfc6}
.bc.edit i.on:hover{background:#3a3226}
.bc.ok{border-color:#2c8a38;box-shadow:0 0 0 3px #2c8a38}
.bc.no{border-color:#b3261e;box-shadow:0 0 0 3px #b3261e}
.bc.click{cursor:pointer}
.bc.click:hover{box-shadow:0 0 0 3px var(--blue)}
.brow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;color:var(--paper-ink)}
.bookpage{background:#efe4c6;border:4px solid #5b3a21;padding:16px;box-shadow:inset 0 0 0 3px #d9caa2}
.dotnums{font-size:14px;color:#6b5f48;margin-top:6px}

/* ---------- Gebärden ---------- */
.tv{background:#2c2c30;border:5px solid var(--line);padding:14px;display:flex;gap:14px;align-items:center;max-width:520px;box-shadow:inset 0 0 0 3px #48484f}
.screen{width:260px;height:230px;background:#fff;border:6px solid #111;display:grid;place-items:center;position:relative;overflow:hidden}
.screen img{width:210px;height:210px;object-fit:contain}
.screen .cnt{position:absolute;right:6px;bottom:4px;font-family:var(--mono);font-size:13px;color:#666}
.screen .rec{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:12px;color:#c00;font-weight:700}
.tvknobs{display:flex;flex-direction:column;gap:10px}
.handstrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.handstrip figure{margin:0;background:#fff;border:3px solid var(--line);padding:3px;display:flex;flex-direction:column;align-items:center}
.handstrip img{width:86px;height:86px}
.handstrip .ln{width:50px;height:3px;background:#cfc6b0;margin:2px 0 4px}
.handgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:10px}
.handgrid button{background:#fff;border:3px solid var(--line);padding:2px;cursor:pointer}
.handgrid button:hover{box-shadow:0 0 0 3px var(--blue)}
.handgrid button.hl{box-shadow:0 0 0 4px var(--accent)}
.handgrid img{width:100%;aspect-ratio:1;display:block}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:84px;padding:6px;background:#0f0c20;border:3px solid #5b5287}
.picked img{width:68px;height:68px;background:#fff;border:3px solid var(--line)}
.picked img.no{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.picked img.ok{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}

/* ---------- Final ---------- */
.mixed{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.mixed .cell{background:#fff;border:3px solid var(--line);min-width:96px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;color:var(--paper-ink)}
.mixed .cell .mc{color:#1f1a12}
.mixed .cell img{width:92px;height:92px}
.mixed .cell .sem{width:90px;height:92px}
.mixed .cell small{font-family:var(--mono);font-size:11px;color:#6b5f48;margin-top:4px}

/* ---------- Codebuch ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font-family:var(--mono);font-weight:700;font-size:15px;background:#332b59;border:3px solid #5b5287;color:var(--ink);padding:7px 12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#1b1500;border-color:var(--line)}
.cbgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.cbgrid .e{background:#fff;color:var(--paper-ink);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:4px}
.cbgrid .e b{font-family:var(--mono);font-size:20px}
.cbgrid .e .sem{width:84px;height:86px}
.cbgrid .e img{width:92px;height:92px}
.cbgrid.morse{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cbgrid.morse .e{flex-direction:row;justify-content:space-between;padding:8px 12px}
.cbgrid .e .mc{color:#1f1a12}
.src{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- Start / Report ---------- */
.center{max-width:720px;margin:4vh auto}
.title-card{text-align:center;padding:26px 22px}
.title-card h1{font-family:var(--mono);color:var(--accent);font-size:34px;margin:0 0 6px;text-shadow:4px 4px 0 #000;letter-spacing:.06em}
.title-card p{color:#ddd5ee}
.codes-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:18px 0}
.codes-row div{background:#fff;border:3px solid var(--line);padding:6px;width:110px;height:110px;display:grid;place-items:center;color:#1f1a12;overflow:hidden}
.codes-row img{width:92px;height:92px}
.codes-row .sem{width:92px;height:92px}
.tblwrap{overflow-x:auto}
.report table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px}
.report th,.report td{border:2px solid #4a4170;padding:6px 8px;text-align:left;vertical-align:top}
.report th{background:#2f2850;font-family:var(--mono);font-size:13px}
.st3{color:#7ff08a;font-weight:700}.st2{color:#d8f07f;font-weight:700}.st1{color:#ffbf5f;font-weight:700}.st0{color:#ff8a7a;font-weight:700}
.legend{font-size:14px;color:var(--muted)}
.comp td{text-align:center}
.comp td:first-child{text-align:left}
.door-anim{height:150px;display:flex;justify-content:center;align-items:flex-end;margin:10px 0}
.door-anim .door{width:90px;height:140px;background:#8a5530;border:5px solid #3e2615;transform-origin:left;animation:dooropen 1.6s ease forwards;box-shadow:inset 0 0 0 8px #7a4a28}
.door-anim .frame{width:100px;height:150px;background:linear-gradient(#fff8c8,#ffe27a);border:5px solid #3e2615;display:flex;align-items:flex-end;padding:0 0 0 0}
@keyframes dooropen{to{transform:perspective(300px) rotateY(-75deg)}}

@media (max-width:640px){
  html,body{font-size:16px}
  .brand{font-size:18px}
  .semwrap .sem{width:240px;height:240px}
  .screen{width:200px;height:190px}.screen img{width:170px;height:170px}
  .tree{height:300px}.node{width:34px;height:34px;font-size:16px}
  .slot .tile{width:28px;height:28px;font-size:15px}
}
@media print{
  body{background:#fff;color:#000}
  #app,.overlay:not(.print-me){display:none!important}
  .overlay.print-me{position:static;background:#fff;padding:0}
  .overlay.print-me .modal{box-shadow:none;border:none;color:#000;background:#fff}
  .overlay.print-me .mhead{background:#fff}
  .overlay.print-me .mhead h2{color:#000}
  .overlay.print-me .no-print{display:none!important}
  .report th{background:#eee}
  .report th,.report td{border-color:#999;color:#000}
}
</style>
</head>
<body>
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand pix">Signalstation<small id="who"></small></div>
    <div class="locks" id="locks"></div>
    <div class="tools">
      <button class="btn small" id="btnBook" title="Codebuch öffnen">📖 Codebuch</button>
      <button class="btn small alt" id="btnSound" title="Ton an/aus">🔊</button>
      <button class="btn small ghost" id="btnTeacher" title="Lehrkraft-Bereich">⚙</button>
    </div>
  </div>
  <div class="roomwrap" id="roomwrap">
    <canvas id="room" width="320" height="180" aria-label="Pixelgrafik: Raum der Signalstation"></canvas>
  </div>
  <div class="hint-line" id="hintline">Klicke auf die Gegenstände im Raum. Jede Station öffnet ein Schloss an der Tür.</div>
</div>
<div id="layer"></div>

<script>
'use strict';
/* =========================================================
   EINSTELLUNGEN FÜR DIE LEHRKRAFT
   PIN: Zugang zum Lehrkraft-Bereich (⚙ oben rechts)

function semSVG(dirs, opt = {}){
  const sx = 50, sy = 40, L = 40;
  let s = `<svg class="sem" viewBox="${opt.targets ? '-14 -14 128 128' : '-4 -6 108 112'}" aria-hidden="true">`;
  s += `<rect x="44" y="72" width="5" height="26" fill="#1a1a1a"/><rect x="51" y="72" width="5" height="26" fill="#1a1a1a"/>`;
  s += `<rect x="42.5" y="33" width="15" height="41" rx="5" fill="#1a1a1a"/><circle cx="50" cy="23" r="8" fill="#1a1a1a"/>`;
  if (opt.targets) for (const d in ANG){
    const a = ANG[d] * Math.PI / 180, x = sx + Math.cos(a) * L, y = sy + Math.sin(a) * L;
    s += `<circle class="tg${dirs.includes(d) ? ' on' : ''}" data-d="${d}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/>`;
  }
  for (const d of dirs){
    /* Flagge hängt immer an der Unterseite der Stange */
    const yf = ['E','NE','SE'].includes(d) ? sy + 14 : sy - 14;
    s += `<g transform="rotate(${ANG[d]} ${sx} ${sy})"><line x1="${sx}" y1="${sy}" x2="${sx+L}" y2="${sy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>`
       + `<polygon points="${sx+L-14},${sy} ${sx+L},${sy} ${sx+L},${yf}" fill="#e3342f"/>`
       + `<polygon points="${sx+L-14},${sy} ${sx+L-14},${yf} ${sx+L},${yf}" fill="#ffd21f"/>`
       + `<rect x="${sx+L-14}" y="${Math.min(yf, sy)}" width="14" height="14" fill="none" stroke="#1a1a1a" stroke-width="1"/></g>`;
  }
  return s + '</svg>';
}

let AC = null;
let settings = Object.assign({ sound: true, codebook: true }, lsGet(SET_KEY) || {});
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, when = 0, type = 'sine', vol = .18){
  if (!settings.sound) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  const t = a.currentTime + when; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008);
  g.gain.setValueAtTime(vol, t + dur - .012); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}

function genB3(){
  const word = pick(POOLS.b3);
  for (let tries = 0; tries < 50; tries++){
    const pos = rnd(word.length), orig = word[pos];
    const cands = ABC.filter(c => c !== orig && !word.includes(c) && (BR[c].filter(n => !BR[orig].includes(n)).length + BR[orig].filter(n => !BR[c].includes(n)).length) === 1);
    if (cands.length) return { word, pos, wrong: pick(cands) };
  }
  return { word, pos: 0, wrong: word[0] === 'A' ? 'B' : 'A' };
}

function newState(name){
  const st = { v:1, name, started: Date.now(), ended: null, codebook: { morse:0, winker:0, braille:0, sign:0 }, tasks:{}, stations:{}, final:null };
  for (const s of STATIONS){ st.stations[s.id] = { done:false, end:null }; for (const t of s.tasks) st.tasks[t.key] = { tries:0, wrong:[], hints:0, sol:false, done:false, start:null, end:null, notes:[], data: t.gen() }; }
  st.final = { tries:0, wrong:[], hints:0, sol:false, done:false, start:null, end:null, notes:[], data:{ word: pick(POOLS.fin) } };
  return st;
}

/* ---------- Modal-System ---------- */
function openModal({ title, sub = '', body = '', narrow = false, top = false, onClose = null, closable = true, id = '' }){
  const ov = document.createElement('div');
  ov.className = 'overlay' + (top ? ' top' : '');
  if (id) ov.id = id;
  ov.innerHTML = `<div class="modal${narrow ? ' narrow' : ''}" role="dialog" aria-modal="true">
    <div class="mhead"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${closable ? '<button class="close no-print" aria-label="Schließen">✕</button>' : ''}</div>
    <div class="mbody">${body}</div></div>`;
  $('#layer').appendChild(ov);
  const close = () => { ov.remove(); if (onClose) onClose(); };
  if (closable){ $('.close', ov).onclick = close; }
  ov.addEventListener('keydown', e => { if (e.key === 'Escape' && closable){ e.stopPropagation(); close(); } });
  return { ov, body: $('.mbody', ov), close };
}

function tileBoard(bank, slots, letters){
  let sel = null, uid = 0;
  const mk = L => { const t = document.createElement('button'); t.className = 'tile keep'; t.textContent = L; t.dataset.l = L; t.id = 'tile' + (uid++) + Math.random().toString(36).slice(2,6); t.draggable = true; t.type = 'button';
    t.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', t.id); });
    t.onclick = e => { e.stopPropagation(); if (t.parentElement.classList.contains('locked')) return;
      if (t.parentElement === bank){ if (sel) sel.classList.remove('sel'); sel = (sel === t) ? null : t; if (sel) sel.classList.add('sel'); sfx.click(); }
      else { returnTile(t); } };
    return t; };
  const returnTile = t => { t.classList.remove('sel'); const sl = t.parentElement; bank.appendChild(t); if (sl && sl.classList) sl.classList.remove('ok', 'no'); };
  const place = (t, slot) => { if (!t || slot.classList.contains('locked')) return; const old = slot.querySelector('.tile'); if (old) returnTile(old); const prev = t.parentElement; slot.appendChild(t); t.classList.remove('sel'); slot.classList.remove('ok', 'no'); if (prev && prev !== bank && prev.classList) prev.classList.remove('ok','no'); sel = null; sfx.click(); };
  shuffle(letters).forEach(L => bank.appendChild(mk(L)));
  for (const s of slots){
    s.el.addEventListener('click', () => { if (sel) place(sel, s.el); });
    s.el.addEventListener('dragover', e => { e.preventDefault(); s.el.classList.add('over'); });
    s.el.addEventListener('dragleave', () => s.el.classList.remove('over'));
    s.el.addEventListener('drop', e => { e.preventDefault(); s.el.classList.remove('over'); place(document.getElementById(e.dataTransfer.getData('text/plain')), s.el); });
  }
  bank.addEventListener('dragover', e => { e.preventDefault(); bank.classList.add('over'); });
  bank.addEventListener('dragleave', () => bank.classList.remove('over'));
  bank.addEventListener('drop', e => { e.preventDefault(); bank.classList.remove('over'); const t = document.getElementById(e.dataTransfer.getData('text/plain')); if (t && !t.parentElement.classList.contains('locked')) returnTile(t); });
  return {
    check(){
      const empty = slots.filter(s => !s.el.querySelector('.tile')).length;
      if (empty) return { empty };
      const wrong = [];
      for (const s of slots){ const L = s.el.querySelector('.tile').dataset.l; if (L === s.answer){ s.el.classList.add('ok', 'locked'); s.el.classList.remove('no'); } else { s.el.classList.add('no'); wrong.push(s.answer + '→' + L); } }
      return { empty: 0, wrong };
    },
    fill(){ for (const s of slots){ const t = s.el.querySelector('.tile'); if (t) returnTile(t); } for (const s of slots){ const t = $$('.tile', bank).find(x => x.dataset.l === s.answer); if (t) s.el.appendChild(t); s.el.classList.add('ok','locked'); } }
  };
}
function answerBox(area, onCheck, ph = 'Lösungswort'){
  const box = document.createElement('div'); box.className = 'answer';
  box.innerHTML = `<input type="text" autocomplete="off" spellcheck="false" placeholder="${ph}" aria-label="${ph}"><button class="btn">Prüfen</button>`;
  area.appendChild(box);
  const inp = $('input', box);
  const go = () => { const v = norm(inp.value); if (!v){ inp.focus(); return; } onCheck(v, inp); };
  $('button', box).onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => inp.focus(), 50);

}
function wordFeedback(given, word){
  if (given.length !== word.length) return `Das Lösungswort hat ${word.length} Buchstaben – du hast ${given.length} eingegeben.`;
  const n = correctPositions(given, word);
  return `${n} von ${word.length} Buchstaben stimmen schon. Prüfe die anderen noch einmal mit dem Codebuch.`;
}

function playMorse(word, lamp, unit = 110){
  if (morsePlaying) return; morsePlaying = true;
  const seq = []; [...word].forEach((c, i) => { [...MORSE[c]].forEach((s, j) => { seq.push([1, s === '.' ? 1 : 3]); seq.push([0, 1]); }); seq.push([0, 2]); });
  let t = 0; const a = settings.sound ? ac() : null;
  for (const [on, n] of seq){ if (on){ const st = t; setTimeout(() => lamp.classList.add('on'), st); setTimeout(() => lamp.classList.remove('on'), st + n * unit); if (a) tone(620, n * unit / 1000, st / 1000, 'sine', .2); } t += n * unit; }
  setTimeout(() => { morsePlaying = false; }, t + 50);
}

const FINAL_ORDER = ['morse','winker','braille','sign'];
const FINAL_NAMES = { morse:'Morse', winker:'Winker', braille:'Braille', sign:'Finger' };
function openDoor(){
  const open = STATIONS.filter(s => S.stations[s.id].done).length;
  if (open < 4){
    const m = openModal({ title:'TÜR · verschlossen', narrow:true, body:`<p class="story">Die Tür hat vier Schlösser. Jedes Schloss gehört zu einer Codierung. Offen: <b>${open} von 4</b>.</p>
      <ul>${STATIONS.map(s => `<li>${S.stations[s.id].done ? '✅' : '🔒'} ${s.code}</li>`).join('')}</ul><button class="btn" id="ok">Okay</button>` });
    $('#ok', m.ov).onclick = m.close; return;
  }
  if (S.final.done){ showReport(); return; }
  const rec = S.final, d = rec.data; if (!rec.start){ rec.start = Date.now(); save(); }
  if (curModal) curModal.close();
  curModal = openModal({ title:'TÜR · Letztes Rätsel', sub:'Alle vier Schlösser sind offen – aber die Tür verlangt noch ein Passwort.', onClose: () => { curModal = null; refresh(); } });
  const body = curModal.body;
  const cell = (c, i) => { const k = FINAL_ORDER[i % 4]; let inner = '';
    if (k === 'morse') inner = `<div style="font-size:0;padding:8px">${morseHTML(MORSE[c])}</div>`;
    if (k === 'winker') inner = semSVG(SEM[c]);
    if (k === 'braille') inner = brailleHTML(BR[c], '', 14);
    if (k === 'sign') inner = handIMG(c);
    return `<div class="cell">${inner}<small>${i + 1}</small></div>`; };
  body.innerHTML = `<p class="story">Auf dem Türschild steht das Passwort – jeder Buchstabe ist in einer <b>anderen Codierung</b> geschrieben. Jetzt brauchst du alles, was du gelernt hast!</p>
    <div class="paper"><div class="mixed">${[...d.word].map(cell).join('')}</div></div><div id="tarea"></div><div class="fb" id="fb"></div><div id="solarea"></div>
    <div class="mfoot">${settings.codebook ? '<button class="btn small alt" id="tbBook">📖 Codebuch</button>' : ''}<button class="btn small alt" id="tbHint">💡 Tipp</button><button class="btn small ghost hidden" id="tbSol">Lösung anzeigen</button><span class="spacer"></span><button class="btn ok hidden" id="tbNext">Tür öffnen ▶</button></div>`;
  const fb = $('#fb', body);
  const finish = () => { rec.done = true; rec.end = Date.now(); S.ended = Date.now(); save(); sfx.win(); $('#tbNext', body).classList.remove('hidden'); $('#tbHint', body).disabled = true; $('#tbSol', body).classList.add('hidden'); $$('#tarea input, #tarea button', body).forEach(e => e.disabled = true); };
  answerBox($('#tarea', body), v => {
    if (rec.done) return;
    if (v === d.word){ fb.className = 'fb good'; fb.innerHTML = `✓ „${d.word}“ – Klick! Das Türschloss springt auf!`; finish(); }
    else { rec.tries++; if (rec.wrong.length < 12) rec.wrong.push(v); save(); sfx.bad(); fb.className = 'fb bad'; fb.innerHTML = '✗ ' + wordFeedback(v, d.word); if (rec.tries >= CONFIG.SOLUTION_AFTER) $('#tbSol', body).classList.remove('hidden'); }
  }, 'Passwort');
  if (rec.tries >= CONFIG.SOLUTION_AFTER) $('#tbSol', body).classList.remove('hidden');
  if ($('#tbBook', body)) $('#tbBook', body).onclick = () => openCodebook('morse');
  $('#tbHint', body).onclick = () => { if (!rec.hintSeen){ rec.hints++; rec.hintSeen = true; save(); } fb.className = 'fb info'; fb.innerHTML = `💡 Die Codierungen wechseln sich immer ab: Morse → Winker → Braille → Gebärdenalphabet → Morse … Das Passwort beginnt mit „${d.word[0]}“.`; };
  $('#tbSol', body).onclick = () => { rec.sol = true; $('#solarea', body).innerHTML = `<div class="solbox"><b>Lösung:</b> ${d.word}</div>`; fb.className = 'fb good'; fb.innerHTML = 'Die Lösung wurde angezeigt.'; finish(); };
  $('#tbNext', body).onclick = () => { curModal.close(); showEscape(); };
}

   AUSWERTUNG (Diagnose)
   ========================================================= */
function score(r){ if (!r.done) return null; if (r.sol) return 0; if (r.tries === 0 && r.hints === 0) return 3; if ((r.tries <= 2 && r.hints === 0) || (r.tries === 0 && r.hints <= 1)) return 2; return 1; }
const SCORE_TXT = { 3:'sicher', 2:'überwiegend sicher', 1:'mit Schwierigkeiten', 0:'Lösung angezeigt' };
const SCORE_SYM = { 3:'●●●', 2:'●●○', 1:'●○○', 0:'○○○' };
function stationLevel(st){ const sc = st.tasks.map(t => score(S.tasks[t.key])).filter(x => x !== null); if (!sc.length) return null; const avg = sc.reduce((a, b) => a + b, 0) / sc.length;
  return avg >= 2.6 ? 3 : avg >= 1.8 ? 2 : avg >= 1 ? 1 : 0; }
const LEVEL_TXT = { 3:'sicher', 2:'überwiegend sicher', 1:'teilweise sicher', 0:'Förderbedarf' };
function reportHTML(){
  const now = S.ended || Date.now();
  const total = S.ended ? fmtTime(S.ended - S.started) : fmtTime(now - S.started) + ' (läuft noch)';
  let h = `<div class="report"><p><b>Name:</b> ${esc(S.name)} &nbsp; · &nbsp; <b>Datum:</b> ${new Date(S.started).toLocaleDateString('de-DE')} &nbsp; · &nbsp; <b>Gesamtzeit:</b> ${total} &nbsp; · &nbsp; <b>Status:</b> ${S.final.done ? 'entkommen ✅' : 'noch im Raum'}</p>`;
  // Kompetenzübersicht
  const cols = [['Decodieren', ['Decodieren']], ['Codieren', ['Codieren']], ['Vertiefung', ['Strukturwissen','Prüfen & Korrigieren']]];
  h += `<h3 class="pix" style="font-size:16px">Überblick nach Codierung</h3><div class="tblwrap"><table class="comp"><tr><th>Codierung</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}<th>Gesamt</th></tr>`;
  for (const st of STATIONS){
    h += `<tr><td><b>${st.code}</b></td>`;
    for (const [, kinds] of cols){ const ts = st.tasks.filter(t => kinds.includes(t.kind)); const sc = ts.map(t => score(S.tasks[t.key]));
      h += `<td>${ts.length ? sc.map(s => s === null ? '<span style="color:#888">offen</span>' : `<span class="st${s}" title="${SCORE_TXT[s]}">${SCORE_SYM[s]}</span>`).join(' ') : '–'}</td>`; }
    const lv = stationLevel(st); h += `<td>${lv === null ? '–' : `<span class="st${lv}">${LEVEL_TXT[lv]}</span>`}</td></tr>`;
  }
  const fs = score(S.final);
  h += `<tr><td><b>Finale (gemischt)</b></td><td colspan="3" style="text-align:left">Passwort decodieren</td><td>${fs === null ? 'offen' : `<span class="st${fs}">${SCORE_TXT[fs]}</span>`}</td></tr></table></div>`;
  h += `<p class="legend">●●● fehlerfrei ohne Tipp · ●●○ wenige Fehler oder 1 Tipp · ●○○ mehrere Fehler/Tipp · ○○○ Lösung angezeigt</p>`;
  // Details
  h += `<h3 class="pix" style="font-size:16px">Details pro Aufgabe</h3><div class="tblwrap"><table><tr><th>Station / Aufgabe</th><th>Art</th><th>Ergebnis</th><th>Fehl&shy;versuche</th><th>Tipp</th><th>Zeit</th><th>Falsche Eingaben</th></tr>`;
  const row = (name, kind, r, extra = '') => { const s = score(r);
    return `<tr><td>${name}${extra}</td><td>${kind}</td><td>${s === null ? (r.start ? 'begonnen' : 'offen') : `<span class="st${s}">${SCORE_TXT[s]}</span>`}</td><td>${r.tries}</td><td>${r.hints ? 'ja' : '–'}</td><td>${r.done ? fmtTime(r.end - r.start) : '–'}</td><td style="font-size:13px">${r.wrong.map(esc).join('; ') || '–'}${r.notes.length ? `<br><i>${r.notes.map(esc).join(', ')}</i>` : ''}</td></tr>`; };
  for (const st of STATIONS) for (const t of st.tasks){ const r = S.tasks[t.key]; const w = r.data.word ? ` <small>(${r.data.word})</small>` : '';
    h += row(`<b>${st.code}</b>: ${t.title}${w}`, t.kind, r); }
  h += row(`<b>Finale</b>: Tür-Passwort <small>(${S.final.data.word})</small>`, 'Decodieren (gemischt)', S.final);
  h += `</table></div><p class="legend">Codebuch geöffnet: Morse ${S.codebook.morse}× · Winker ${S.codebook.winker}× · Braille ${S.codebook.braille}× · Gebärdenalphabet ${S.codebook.sign}×${settings.codebook ? '' : ' (Codebuch war ausgeschaltet)'}</p></div>`;
  return h;
}
function reportText(){
  const L = []; L.push('ESCAPE ROOM SIGNALSTATION – AUSWERTUNG'); L.push('Name: ' + S.name); L.push('Datum: ' + new Date(S.started).toLocaleString('de-DE'));
  L.push('Gesamtzeit: ' + (S.ended ? fmtTime(S.ended - S.started) : 'nicht beendet')); L.push('');
  for (const st of STATIONS){ const lv = stationLevel(st); L.push(`${st.code}: ${lv === null ? 'offen' : LEVEL_TXT[lv]}`);
    for (const t of st.tasks){ const r = S.tasks[t.key], s = score(r); L.push(`  - ${t.title} [${t.kind}]${r.data.word ? ' (' + r.data.word + ')' : ''}: ${s === null ? 'offen' : SCORE_TXT[s]}; Fehlversuche ${r.tries}; Tipp ${r.hints ? 'ja' : 'nein'}; Zeit ${r.done ? fmtTime(r.end - r.start) : '-'}${r.wrong.length ? '; falsch: ' + r.wrong.join(' | ') : ''}${r.notes.length ? '; ' + r.notes.join(', ') : ''}`); } }
  const f = S.final, fs = score(f); L.push(`Finale (${f.data.word}): ${fs === null ? 'offen' : SCORE_TXT[fs]}; Fehlversuche ${f.tries}; Tipp ${f.hints ? 'ja' : 'nein'}${f.wrong.length ? '; falsch: ' + f.wrong.join(' | ') : ''}`);
  L.push(''); L.push(`Codebuch geöffnet: Morse ${S.codebook.morse}x, Winker ${S.codebook.winker}x, Braille ${S.codebook.braille}x, Gebärdenalphabet ${S.codebook.sign}x`);
  return L.join('\r\n');
}
function showReport(){
  const m = openModal({ title:'AUSWERTUNG', sub:'Diagnose: Wie sicher werden die Codierungen angewendet?', body: reportHTML() + `<div class="mfoot no-print"><button class="btn alt" id="pr">🖨 Drucken</button><button class="btn alt" id="dl">💾 Als Textdatei speichern</button><span class="spacer"></span><button class="btn" id="cl">Schließen</button></div>` });
  m.ov.classList.add('print-me');
  $('#pr', m.ov).onclick = () => window.print();
  $('#dl', m.ov).onclick = () => { const blob = new Blob(['﻿' + reportText()], { type:'text/plain;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Auswertung_' + S.name.replace(/[^\wäöüÄÖÜß-]+/g, '_') + '.txt'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  $('#cl', m.ov).onclick = m.close;
}

/* =========================================================
   LEHRKRAFT-BEREICH
   ========================================================= */
function openTeacher(){
  const m = openModal({ title:'⚙ LEHRKRAFT', narrow:true, top:true, body:`<p>Bitte PIN eingeben:</p><div class="answer"><input type="password" id="pin" class="inp" inputmode="numeric" autocomplete="off"><button class="btn" id="go">OK</button></div><div class="fb" id="pfb"></div>` });
  const go = () => { if ($('#pin', m.ov).value === CONFIG.PIN){ m.close(); teacherPanel(); } else { const f = $('#pfb', m.ov); f.className = 'fb bad'; f.textContent = 'Falsche PIN.'; } };
  $('#go', m.ov).onclick = go; $('#pin', m.ov).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); setTimeout(() => $('#pin', m.ov).focus(), 50);
}
function teacherPanel(){
  const sol = [];
  if (S){ for (const st of STATIONS) for (const t of st.tasks){ sol.push(`<li><b>${st.code} – ${t.title}:</b> ${RENDER[t.key].solution(S.tasks[t.key].data)}</li>`); } sol.push(`<li><b>Finale:</b> ${S.final.data.word}</li>`); }
  const m = openModal({ title:'⚙ LEHRKRAFT-BEREICH', top:true, body:`
    <div class="row"><button class="btn" id="rep" ${S ? '' : 'disabled'}>📊 Auswertung anzeigen</button>
    <button class="btn alt" id="cb">${settings.codebook ? '📖 Codebuch ausschalten' : '📖 Codebuch einschalten'}</button>
    <button class="btn" id="reset" style="background:var(--red);color:#fff;box-shadow:none">Neuer Durchgang (Spielstand löschen)</button></div>
    <p class="legend" style="margin-top:10px">Das Codebuch ist ${settings.codebook ? '<b>eingeschaltet</b> (Codetabellen dürfen genutzt werden)' : '<b>ausgeschaltet</b> (Codes müssen auswendig gekonnt werden)'}. Die Einstellung bleibt auf diesem Gerät gespeichert.</p>
    ${S ? `<h3 class="pix" style="font-size:16px">Lösungen dieses Durchgangs (${esc(S.name)})</h3><ul style="font-size:15px">${sol.join('')}</ul>` : ''}
    <div class="fb" id="rfb"></div>` });
  $('#rep', m.ov).onclick = () => { m.close(); showReport(); };
  $('#cb', m.ov).onclick = () => { settings.codebook = !settings.codebook; lsSet(SET_KEY, settings); m.close(); if (S) refresh(); teacherPanel(); };
  let armed = false;
  $('#reset', m.ov).onclick = () => { if (!armed){ armed = true; const f = $('#rfb', m.ov); f.className = 'fb bad'; f.textContent = 'Wirklich? Der aktuelle Spielstand und die Auswertung werden gelöscht. Zum Bestätigen noch einmal klicken.'; return; }
    lsDel(STORE_KEY); S = null; $('#layer').innerHTML = ''; $('#app').classList.add('hidden'); startScreen(); };
}

/* =========================================================
   START
   ========================================================= */
function startScreen(){
  const saved = lsGet(STORE_KEY);
  const ov = document.createElement('div'); ov.className = 'center';
  ov.innerHTML = `<div class="modal"><div class="title-card">
    <h1>SIGNALSTATION</h1><p class="pix" style="color:var(--muted);font-size:14px">Ein Escape Room zu Codierungen</p>
    <div class="codes-row"><div style="font-size:0">${morseHTML('..-.')}</div><div>${semSVG(SEM.R)}</div><div>${brailleHTML(BR.E, '', 16)}</div><div>${handIMG('I')}</div></div>
    <p>Du bist in einer alten Signalstation eingeschlossen. Die Tür hat <b>vier Schlösser</b> – eins für jede Codierung: <b>Morsecode</b>, <b>Winkeralphabet</b>, <b>Brailleschrift</b> und <b>Gebärdenalphabet</b>. Löse die Rätsel im Raum, um zu entkommen!</p>
    ${saved ? `<p style="margin-top:18px">Gespeicherter Spielstand von <b>${esc(saved.name)}</b> gefunden.</p><button class="btn" id="cont">▶ Weiterspielen</button>
      <p class="legend" style="margin-top:14px">Neuer Durchgang für eine andere Person? Das macht die Lehrkraft über ⚙.</p><button class="btn small ghost" id="tch">⚙ Lehrkraft</button>`
    : `<div class="answer" style="max-width:460px;margin:18px auto 0"><input type="text" id="nm" maxlength="40" placeholder="Dein Name" style="text-transform:none;letter-spacing:.03em" autocomplete="off"><button class="btn" id="go">Los geht’s ▶</button></div><div class="fb" id="nfb"></div>
       <p class="legend" style="margin-top:16px">Tipp: Im Raum findest du ein 📖 Codebuch mit allen Codetabellen.</p>`}
  </div></div>`;
  $('#layer').appendChild(ov);
  if (saved){ $('#cont', ov).onclick = () => { ac(); S = saved; ov.remove(); enterRoom(false); }; $('#tch', ov).onclick = openTeacher; }
  else {
    const go = () => { const n = $('#nm', ov).value.trim(); if (n.length < 2){ const f = $('#nfb', ov); f.className = 'fb bad'; f.textContent = 'Bitte gib deinen Namen ein.'; return; }
      ac(); S = newState(n); save(); ov.remove(); enterRoom(true); };
    $('#go', ov).onclick = go; $('#nm', ov).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); setTimeout(() => $('#nm', ov).focus(), 50);
  }
}
function enterRoom(first){
  $('#app').classList.remove('hidden'); refresh();
  if (first){
    const m = openModal({ title:'WO BIN ICH?', narrow:true, body:`<p class="story">Die Tür ist ins Schloss gefallen! An ihr leuchten <b>vier rote Lämpchen</b>.</p>
      <p class="story">Im Raum sind <b>vier Stationen mit je drei Rätseln</b> versteckt – also <b>12 Rätsel</b>. Untersuche alles genau! Löst du alle Rätsel einer Station, geht ein Schloss auf. Wenn alle vier Schlösser offen sind, wartet noch ein letztes Rätsel.</p>
      ${settings.codebook ? '<p class="story">Auf dem Schreibtisch liegt ein <b>📖 Codebuch</b> – das darfst du jederzeit benutzen.</p>' : ''}
      <p class="story">Wenn du feststeckst, gibt es einen 💡 Tipp. Probier es aber erst selbst!</p><button class="btn" id="ok">Los!</button>` });
    $('#ok', m.ov).onclick = m.close;
  } else if (S.final.done){ showReport(); }
}
$('#btnBook').onclick = () => openCodebook();
$('#btnSound').onclick = () => { settings.sound = !settings.sound; lsSet(SET_KEY, settings); updateTop(); };
$('#btnTeacher').onclick = openTeacher;
startScreen();
</script>
</body>
